# ==============================================================================
# PROJECTIFY — AWS LOAD BALANCER CONTROLLER MANIFEST
# ==============================================================================
#
# PURPOSE:
#   Deploys the official AWS Load Balancer Controller in the `kube-system` namespace.
#   Listens for Ingress resources with `ingressClassName: alb` and provisions an
#   AWS Application Load Balancer (ALB) dynamically on AWS.
# ==============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
  annotations:
    # Update with your IAM Role ARN from terraform output alb_controller_role_arn
    eks.amazonaws.com/role-arn: arn:aws:iam::867490540447:role/projectify-alb-controller-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aws-load-balancer-controller-role
rules:
  - apiGroups: [""]
    resources: ["endpoints", "events", "namespaces", "nodes", "pods", "pods/status", "services", "services/status", "configmaps"]
    verbs: ["create", "get", "list", "update", "watch", "patch"]
  - apiGroups: ["networking.k8s.io", "extensions"]
    resources: ["ingresses", "ingresses/status", "ingressclasses"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["elbv2.k8s.aws"]
    resources: ["targetgroupbindings", "targetgroupbindings/status"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aws-load-balancer-controller-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aws-load-balancer-controller-role
subjects:
  - kind: ServiceAccount
    name: aws-load-balancer-controller
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: aws-load-balancer-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aws-load-balancer-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aws-load-balancer-controller
    spec:
      serviceAccountName: aws-load-balancer-controller
      containers:
        - name: aws-load-balancer-controller
          image: public.ecr.aws/eks/aws-load-balancer-controller:v2.7.2
          args:
            - --cluster-name=projectify-eks-cluster
            - --ingress-class=alb
            - --aws-vpc-id=vpc-0a858518c165dd69f
            - --aws-region=us-east-1
          ports:
            - containerPort: 9443
              name: webhook-server
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
